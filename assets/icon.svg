<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!--
		Pi Pocket's icon (Pi Pocket's web/icon.svg) on a rounded tile: the dark frame keeps its place around the card,
		and its outer edge is a continuous-corner rounded square, the shape of a macOS app icon (radius 22.5%, smoothing
		0.6). The card's corners (75) follow the tile's, as Pi Pocket drew them to follow Apple's mask. The π is
		Gelasio's (Georgia's metrics) as an outline, so every renderer draws the same glyph. scripts/icons.mjs renders
		the PNGs from this file, with each system's margin around the tile.
	-->
	<defs>
		<linearGradient id="active" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#33ccff" />
			<stop offset="1" stop-color="#00ff99" />
		</linearGradient>
	</defs>
