<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!--
		Pi Pocket's icon (Pi Pocket's web/icon.svg), with nothing outside the frame: the desktop app's icon is the
		rounded frame alone, so a taskbar or dock shows its corners rounded rather than a dark square around it.
		icon-512.png and icon-192.png are Pi Pocket's PNGs with the same cut (a rounded rectangle at 35, 442 wide,
		corner 80, just inside the frame's outer edge), so the π keeps the font it was drawn in.
	-->
	<defs>
		<linearGradient id="active" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#33ccff" />
			<stop offset="1" stop-color="#00ff99" />
		</linearGradient>
	</defs>
	<rect x="40" y="40" width="432" height="432" rx="75" fill="#1a1b26" stroke="url(#active)" stroke-width="12" />
	<text x="256" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="280" text-anchor="middle" fill="#ff9e64">π</text>
</svg>
